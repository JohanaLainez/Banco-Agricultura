<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Banco de Agricultura Salvadoreño</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="header">
        <h1>Banco de Agricultura Salvadoreño</h1>
    </header>

    <main class="login-page">
        <section class="login-card">
            <h2>Iniciar sesión</h2>

            <form>
                <label for="correo">Correo</label>
                <input 
                    type="email" 
                    id="correo" 
                    class="input-field" 
                    placeholder="Ingrese su correo"
                >

                <label for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    class="input-field" 
                    placeholder="Ingrese su contraseña"
                >

                <button type="button" class="btn">Ingresar</button>
            </form>
        </section>
    </main>

</body>
</html>
